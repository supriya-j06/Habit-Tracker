<!DOCTYPE html>
<html>
<head>
    <title>Dashboard | Habit Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Your Habits</h2>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>

    <!-- AI Suggest Button -->
    <button class="btn btn-info mb-3" onclick="suggestHabit()">Suggest Habit 🤖</button>
    <div id="suggestionBox" class="alert alert-secondary d-none"></div>

    <!-- Add Habit Box -->
    <div class="card p-3 mb-4">
        <div class="row g-2">
            <div class="col-md-5">
                <input class="form-control" id="habit_name" placeholder="Habit Name">
            </div>
            <div class="col-md-5">
                <input class="form-control" id="frequency" placeholder="Frequency (Daily/Weekly)">
            </div>
            <div class="col-md-2">
                <button id="addHabit" class="btn btn-primary w-100">Add</button>
            </div>
        </div>
    </div>

    <!-- Habit Table -->
    <table id="habitTable" class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Frequency</th>
                <th>Streak</th>
                <th>Done?</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <!-- Chart Section -->
    <h3 class="mt-4">Progress Chart</h3>
    <canvas id="habitChart" height="120"></canvas>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Main Script -->
<script src="script.js"></script>

</body>
</html>
