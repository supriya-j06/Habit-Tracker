<!DOCTYPE html>
<html>
<head>
    <title>Login | Habit Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>
<body class="bg-light">

<div class="container mt-5" style="max-width:400px;">
    <h2 class="text-center mb-4">Login</h2>

    <form id="loginForm" class="border p-4 shadow-sm bg-white rounded">
        <input class="form-control mb-3" type="email" id="email" placeholder="Email" required>
        <input class="form-control mb-3" type="password" id="password" placeholder="Password" required>
        <button class="btn btn-primary w-100" type="submit">Login</button>
    </form>

    <p class="text-center mt-3">
        Don't have an account? <a href="register.html">Register</a>
    </p>
</div>


<!-- JS -->
<script src="script.js"></script>

</body>
</html>
